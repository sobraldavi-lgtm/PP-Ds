<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Site do grupo PDP: conheça os integrantes e seus gostos pessoais.">

    <title>Início</title>

    <link rel="shortcut icon" type="image/jpeg" href="images/curry.jpg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles/style.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <header class="topo py-4">
        <div class="container">
            <h1 class="h2 fw-bold mb-1">Davi Sobral dos Santos</h1>
            
        </div>
    </header>

    <main class="container flex-grow-1 py-4">
        <section class="cartao mb-4">
            <p class="mb-0">
                Olá, sejam bem-vindos a <strong>minha página pessoal</strong>!
            </p>
        </section>

        <section class="mural" aria-label="Meus personagens favoritos">
            <div class="mural-centro">
                <a class="mural-foto" href="pages/Davi.html">
                    <img src="images/davi.png" alt="Davi">
                    <span>Conheça o Davi →</span>
                </a>
                <h2 class="mt-3">Meus favoritos</h2>
                <p>Clique na minha foto para me conhecer.</p>
            </div>
            <img class="pers p-percy" src="images/externas/harry.png" alt="Harry Potter">
            <img class="pers p-curry30" src="images/externas/hogwarts.png" alt="Brasão de Hogwarts">
            <img class="pers p-freddy" src="images/externas/snorlax.png" alt="Snorlax">
            <img class="pers p-psyduck" src="images/externas/pikachu.png" alt="Pikachu">
            <img class="pers p-lebron" src="images/Golden_State_Warriors_logo.svg.png" alt="Logo do Golden State Warriors">
            <img class="pers p-foxy" src="images/externas/gengar.png" alt="Gengar">
            <img class="pers p-stephen" src="images/externas/curry.png" alt="Stephen Curry">
            <img class="pers p-buttler" src="images/externas/lucario.png" alt="Lucario">
            <img class="pers p-blastoise" src="images/externas/charizard.png" alt="Charizard">
            <img class="pers p-greninja" src="images/externas/smurf.png" alt="Smurfette">
            <img class="pers p-worm" src="images/externas/mewtwo.png" alt="Mewtwo">
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
